spring.application.name=StudentBudgetBackend

# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/student_budget_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SERVER
server.port=8080

# JWT CONFIGURATION
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000